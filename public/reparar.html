<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Limpiar caché · CDH Maker</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 24px; }
    button { padding: 12px 18px; font-size: 16px; cursor: pointer; background: #e0740a; color: #fff; border: 0; border-radius: 8px; }
    p { color: #444; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>Reparar CDH Maker</h1>
  <p>Si ves pantalla en blanco, pulsa el botón. Borrará Service Workers y cachés viejos de este sitio.</p>
  <button id="go">Limpiar y abrir la app</button>
  <pre id="log"></pre>
  <script>
    document.getElementById('go').onclick = async () => {
      const log = document.getElementById('log');
      const say = (t) => { log.textContent += t + '\n'; };
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) { await r.unregister(); say('SW unregistered'); }
        }
        if (window.caches) {
          const keys = await caches.keys();
          for (const k of keys) { await caches.delete(k); say('cache deleted: ' + k); }
        }
        try { sessionStorage.clear(); localStorage.removeItem('cdh_splash_shown'); } catch(e) {}
        say('Listo. Redirigiendo…');
        setTimeout(() => { location.href = '/'; }, 600);
      } catch (e) {
        say('Error: ' + e.message);
      }
    };
  </script>
</body>
</html>
