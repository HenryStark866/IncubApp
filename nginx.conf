map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; frame-src 'self' blob: https://*.supabase.co; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob:; connect-src 'self' https: wss:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; manifest-src 'self'; worker-src 'self' blob:; form-action 'self'" always;

    # Tamaño máximo de subidas (fotos, evidencias)
    client_max_body_size 50M;

    # No cachear sw.js ni index.html para forzar actualización inmediata de SPA/PWA
    location = /sw.js {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
    }

    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
    }

    # Frontend SPA
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia Supabase API Gateway
    location /auth/v1/ {
        proxy_pass http://kong:8000/auth/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header ngrok-skip-browser-warning "69420";
        proxy_pass_header Authorization;
        proxy_pass_header apikey;
        error_page 502 503 504 =502 @api_error;
    }

    location /rest/v1/ {
        proxy_pass http://kong:8000/rest/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header ngrok-skip-browser-warning "69420";
        proxy_pass_header Authorization;
        proxy_pass_header apikey;
        error_page 502 503 504 =502 @api_error;
    }

    location /storage/v1/ {
        proxy_pass http://kong:8000/storage/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header ngrok-skip-browser-warning "69420";
        proxy_pass_header Authorization;
        proxy_pass_header apikey;
        client_max_body_size 100M;
        error_page 502 503 504 =502 @api_error;
    }

    location /functions/v1/ {
        proxy_pass http://kong:8000/functions/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header ngrok-skip-browser-warning "69420";
        proxy_pass_header Authorization;
        proxy_pass_header apikey;
        proxy_read_timeout 120s;
        error_page 502 503 504 =502 @api_error;
    }

    location /realtime/v1/ {
        proxy_pass http://kong:8000/realtime/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header ngrok-skip-browser-warning "69420";
        proxy_pass_header apikey;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Ruta de compatibilidad /sb/ (reenvía a kong sin caer al fallback SPA HTML)
    location /sb/ {
        rewrite ^/sb/(.*)$ /$1 break;
        proxy_pass http://kong:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header ngrok-skip-browser-warning "69420";
        proxy_pass_header Authorization;
        proxy_pass_header apikey;
        error_page 502 503 504 =502 @api_error;
    }

    # Respuesta JSON controlada si kong no responde (evita que la app reciba HTML 502)
    location @api_error {
        default_type application/json;
        return 502 '{"error":"bad_gateway","message":"El servidor local de Supabase no está respondiendo (502). Verifica los contenedores."}';
    }

    error_page   500 502 503 504  =502 /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
