map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    # Cabeceras de seguridad. OJO: nginx solo hereda los add_header del server a una
    # location si esa location no declara ninguno propio. Por eso las locations de
    # abajo controlan la caché con `expires` y no con add_header: así index.html y
    # sw.js también salen con la CSP y el resto.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; frame-src 'self' blob: https://*.supabase.co; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob:; connect-src 'self' https: wss:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; manifest-src 'self'; worker-src 'self' blob:; form-action 'self'" always;

    # Compresión: la app viaja por un túnel (ngrok / Cloudflare) desde el PC de la
    # oficina. Sin gzip el módulo de Mantenimiento pesaba 6,7 MB por descarga; con
    # gzip, ~0,45 MB. También comprime las respuestas JSON de la API (gzip_proxied).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    # Tamaño máximo de subidas (fotos, evidencias)
    client_max_body_size 50M;

    root /usr/share/nginx/html;

    # El gateway de Supabase (servicio `kong`, contenedor supabase-envoy) cambia de IP
    # cada vez que se recrea (instalar.sh, tunel.sh, actualizaciones). Con el nombre
    # fijo en proxy_pass nginx lo resolvía una sola vez al arrancar y seguía mandando
    # la API a la IP vieja: 502 en login y datos hasta reiniciar este contenedor.
    # Con el DNS de Docker y la dirección en una variable se vuelve a resolver sola.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $supabase http://kong:8000;

    # sw.js e index.html: siempre se revalidan, para que una versión nueva llegue
    # de inmediato (expires -1 → Cache-Control: no-cache).
    location = /sw.js {
        expires -1;
    }

    location = /index.html {
        expires -1;
    }

    # Módulos con hash en el nombre: nunca cambian, se guardan un año. Si falta uno
    # (pestaña abierta de una versión anterior) se responde 404 y no index.html,
    # que el navegador rechazaba como script y dejaba el panel en blanco.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Recorridos 3D (planta y granja): sus archivos conservan el mismo nombre en cada
    # versión. Sin esto el navegador los guardaba por su cuenta y seguía mostrando la
    # maqueta anterior después de actualizar. Se revalidan siempre (ETag: si no cambió,
    # responde 304 sin volver a bajarlo). Un archivo que falte da 404, no la app.
    location ~ ^/(planta3d|granja3d)/ {
        try_files $uri $uri/index.html =404;
        expires -1;
    }

    # Frontend SPA
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia Supabase API Gateway
    location /auth/v1/ {
        proxy_pass $supabase;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 502 503 504 =502 @api_error;
    }

    location /rest/v1/ {
        proxy_pass $supabase;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 502 503 504 =502 @api_error;
    }

    location /storage/v1/ {
        proxy_pass $supabase;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        error_page 502 503 504 =502 @api_error;
    }

    location /functions/v1/ {
        proxy_pass $supabase;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        error_page 502 503 504 =502 @api_error;
    }

    location /realtime/v1/ {
        proxy_pass $supabase;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Ruta de compatibilidad /sb/ (reenvía a Supabase sin caer al fallback SPA HTML)
    location ~ ^/sb(/.*)$ {
        proxy_pass $supabase$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 502 503 504 =502 @api_error;
    }

    # Respuesta JSON controlada si Supabase no responde (evita que la app reciba HTML 502)
    location @api_error {
        default_type application/json;
        return 502 '{"error":"bad_gateway","message":"El servidor local de Supabase no está respondiendo (502). Verifica los contenedores."}';
    }

    error_page   500 502 503 504  =502 /50x.html;
    location = /50x.html {
    }
}
